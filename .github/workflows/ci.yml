name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Generate the Prisma client so typecheck/build see the DecisionSnapshot model types.
      # Schema-only; no database connection is made.
      - name: Prisma generate
        run: pnpm db:generate

      - name: Lint (includes engine/corpus boundary rules)
        run: pnpm lint

      # Typecheck is self-sufficient: `pnpm typecheck` runs `next typegen` to generate Next's
      # ambient/route types, so it does NOT depend on a prior `next build`.
      - name: Typecheck
        run: pnpm typecheck

      # Runs the boundary self-test, which fails CI if a prohibited engine/corpus import
      # would be accepted.
      - name: Test
        run: pnpm test

      # Offline corpus gate: schema + semantic lint + frozen reconciliation. No DB/network.
      - name: Corpus validate
        run: pnpm corpus:validate

      - name: Build
        run: pnpm build

      - name: Prisma schema validate
        run: pnpm db:validate
        env:
          # Validation resolves env("DATABASE_URL"); a dummy value is enough (no DB connection).
          DATABASE_URL: postgresql://user:password@localhost:5432/pagamenos_validation?schema=public

      # Offline migration guard: asserts the DecisionSnapshot append-only immutability triggers are
      # present in the migration SQL (no DB connection). The real-Postgres integration suite
      # (pnpm test:integration) runs locally against an ephemeral cluster, not in this offline CI.
      - name: Migration check
        run: pnpm db:migrate:check

      - name: Format check
        run: pnpm format:check

  # M3.5B-A2 operational authority gate (additive, independent, least-privilege). Proves the
  # externally-configured protected repository variable resolves to the accepted immutable authority
  # commit and that its four authority artifacts are readable and internally coherent. The SHA in the
  # variable is the SOLE authority identifier — never a branch/tag/HEAD/working-tree file.
  authority-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history so the authority object is fetchable)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve + fetch accepted authority object
        env:
          BASE_SHA: ${{ vars.PAGAMENOS_ACCEPTED_AUTHORITY_BASE_SHA }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ -z "$(printf '%s' "$BASE_SHA" | tr -d '[:space:]')" ]; then
            echo "::error::PAGAMENOS_ACCEPTED_AUTHORITY_BASE_SHA is unset or blank"; exit 1
          fi
          if ! printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::PAGAMENOS_ACCEPTED_AUTHORITY_BASE_SHA is not a 40-char hex full SHA"; exit 1
          fi
          if [ "$BASE_SHA" = "68269bb5acad77bb6e8dc1644bb32d29ef485d31" ]; then
            echo "::error::rejected authority bootstrap candidate must never be operational authority"; exit 1
          fi
          # Transport-only fetch of the exact reachable object; the branch name is NOT the authority.
          git fetch --no-tags origin "$BASE_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          echo "authority commit present: $BASE_SHA"

      - name: Verify authority artifacts (read only from the accepted SHA)
        env:
          BASE_SHA: ${{ vars.PAGAMENOS_ACCEPTED_AUTHORITY_BASE_SHA }}
        run: |
          set -euo pipefail
          node - "$BASE_SHA" <<'NODE'
          const { execSync } = require('node:child_process');
          const SHA = process.argv[2];
          const REQUIRED = [
            'authority/v1/AUTHORITY_BASELINE_MANIFEST_V1.json',
            'authority/v1/CORPUS_RELEASE_LEDGER_V1.json',
            'authority/v1/HOLIDAY_CALENDAR_REGISTRY_V1.json',
            'authority/v1/holiday-calendar/pagamenos.holiday.pe-lima-callao.private-commerce.v1.json',
          ];
          const CORPUS_ID = 'PAGAMENOS_VALIDATION_CORPUS_v1_2026-08-30T1800-0500';
          const PARENT = '7c0a3d9e0add34e4823c01f22c21542817dbc881';
          const CORPUS_SOURCE = '64cf864a817c137920204487ab3317bc6d4c9ba5';
          const fail = (m) => { console.error('::error::authority-gate: ' + m); process.exit(1); };
          const read = (p) => {
            try { return execSync('git show ' + SHA + ':' + p, { encoding: 'utf8' }); }
            catch (e) { fail('cannot read authority blob ' + p + ' at ' + SHA); }
          };
          const parse = (p) => { try { return JSON.parse(read(p)); } catch (e) { fail('malformed JSON in ' + p + ': ' + e.message); } };
          const [manifest, ledger, registry, fixture] = REQUIRED.map(parse);
          // Manifest inventory: exactly the four paths, no missing/extra/duplicate.
          const inv = Array.isArray(manifest.authorityFiles) ? manifest.authorityFiles : fail('authorityFiles missing/not-array');
          if (new Set(inv).size !== inv.length) fail('authorityFiles contains duplicates');
          const a = [...inv].sort(); const b = [...REQUIRED].sort();
          if (a.length !== b.length || a.some((x, i) => x !== b[i])) fail('authorityFiles inventory != the four required paths');
          // Parent / source constants.
          if (manifest.authorityParentCommit !== PARENT) fail('authorityParentCommit mismatch');
          if (manifest.corpusSourceCommit !== CORPUS_SOURCE) fail('corpusSourceCommit mismatch');
          // Corpus cross-file coherence (digest read from blobs, not hard-coded).
          if (manifest.corpusId !== CORPUS_ID) fail('manifest corpusId mismatch');
          const le = (ledger.entries || {})[CORPUS_ID];
          if (!le) fail('ledger missing corpus entry ' + CORPUS_ID);
          if (le.sourceCommit !== CORPUS_SOURCE) fail('ledger sourceCommit mismatch');
          if (manifest.corpusSemanticDigest !== le.digest) fail('corpus digest: manifest != ledger');
          // Holiday cross-file coherence.
          const hv = manifest.holidayCalendarVersion;
          const re = (registry.entries || {})[hv];
          if (!re) fail('registry missing holiday version ' + hv);
          if (fixture.version !== hv) fail('fixture version != manifest holiday version');
          if (!(manifest.holidayCalendarDigest === re.digest && re.digest === fixture.contentDigest)) {
            fail('holiday digest: manifest/registry/fixture disagree');
          }
          // Holiday dates: exactly 32, strictly sorted, unique.
          const d = Array.isArray(fixture.normalizedDates) ? fixture.normalizedDates : fail('normalizedDates missing');
          if (d.length !== 32) fail('holiday normalizedDates count != 32 (got ' + d.length + ')');
          for (let i = 1; i < d.length; i++) { if (!(d[i - 1] < d[i])) fail('holiday dates not strictly sorted/unique at index ' + i); }
          console.log('AUTHORITY GATE PASS');
          console.log('  authoritySha=' + SHA);
          console.log('  corpusId=' + manifest.corpusId + ' corpusDigest=' + manifest.corpusSemanticDigest);
          console.log('  holidayVersion=' + hv + ' holidayDigest=' + manifest.holidayCalendarDigest + ' dates=' + d.length);
          NODE
