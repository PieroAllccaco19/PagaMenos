name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Generate the Prisma client so typecheck/build see the DecisionSnapshot model types.
      # Schema-only; no database connection is made.
      - name: Prisma generate
        run: pnpm db:generate

      - name: Lint (includes engine/corpus boundary rules)
        run: pnpm lint

      # Typecheck is self-sufficient: `pnpm typecheck` runs `next typegen` to generate Next's
      # ambient/route types, so it does NOT depend on a prior `next build`.
      - name: Typecheck
        run: pnpm typecheck

      # Runs the boundary self-test, which fails CI if a prohibited engine/corpus import
      # would be accepted.
      - name: Test
        run: pnpm test

      # Offline corpus gate: schema + semantic lint + frozen reconciliation. No DB/network.
      - name: Corpus validate
        run: pnpm corpus:validate

      - name: Build
        run: pnpm build

      - name: Prisma schema validate
        run: pnpm db:validate
        env:
          # Validation resolves env("DATABASE_URL"); a dummy value is enough (no DB connection).
          DATABASE_URL: postgresql://user:password@localhost:5432/pagamenos_validation?schema=public

      # Offline migration guard: asserts the DecisionSnapshot append-only immutability triggers are
      # present in the migration SQL (no DB connection). The real-Postgres integration suite
      # (pnpm test:integration) runs locally against an ephemeral cluster, not in this offline CI.
      - name: Migration check
        run: pnpm db:migrate:check

      - name: Format check
        run: pnpm format:check
